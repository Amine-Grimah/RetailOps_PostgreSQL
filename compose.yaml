services:
  db:
    build: .
    image: retailops-postgres:17
    container_name: retailops-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dataset:/dataset:ro
      - ./config/ssl:/etc/postgresql/ssl:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: